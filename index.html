<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LifeWatch România</title><!--ssr-head-->
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Applies the stored theme (or the system one) before first paint. See src/lib/theme.ts.
      (function () {
        var root = document.documentElement, pref = null;
        try { pref = localStorage.getItem("lw.theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0e17");
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <script src="%BASE_URL%runtime-config.js"></script>
    <noscript><style>[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <div id="site"><!--ssr-html--></div>
    <script type="module" src="/src/site/entry-client.tsx"></script>
  </body>
</html>
